<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Meta | Dhruv Mittal</title>
    <link rel="stylesheet" href="../style.css" />
    <script src="../global.js" type="module"></script>
    <script src="main.js" type="module"></script>
  </head>
  <body>
    <main class="container content">
      <h1>Meta</h1>
      <p>This page analyzes the code in this website's repository.</p>
      <!-- Keep the cutoff control and its current date together above the summary. -->
      <div class="filter-row">
        <label>
          Show commits until:
          <input type="range" id="commit-progress" min="0" max="100" step="any" value="100">
        </label>
        <time id="commit-time"></time>
      </div>
      <div id="stats"></div>
      <!-- Pair commit-by-commit story text with the sticky scatterplot. -->
      <div id="scrolly-1">
        <div id="scatter-story"></div>
        <div id="scatter-plot">
          <h2>Commits by time of day</h2>
          <div id="chart"></div>
          <dl id="commit-tooltip" class="info tooltip" hidden>
            <dt>Commit</dt>
            <dd><a href="" id="commit-link" target="_blank" rel="noopener noreferrer"></a></dd>

            <dt>Date</dt>
            <dd id="commit-date"></dd>

            <dt>Time</dt>
            <dd id="commit-tooltip-time"></dd>

            <dt>Author</dt>
            <dd id="commit-author"></dd>

            <dt>Lines edited</dt>
            <dd id="commit-lines"></dd>
          </dl>
          <p id="selection-count">No commits selected</p>
          <dl id="language-breakdown" class="stats"></dl>
        </div>
      </div>
      <!-- Each file row contains its source-line units; the slider and story update it. -->
      <dl id="files"></dl>
    </main>
  </body>
</html>
