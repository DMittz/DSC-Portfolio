    <main class="container content">
      <section class="page-header">
        <h1>Contact</h1>
      </section>

      <section>
        <p>Send me a message using the form below.</p>

        <form action="mailto:dmittal@ucsd.edu" method="POST" enctype="text/plain">
          <label for="email">
            Email
            <input id="email" type="email" name="email" placeholder="name@example.com" />
          </label>

          <label for="subject">
            Subject
            <input id="subject" type="text" name="subject" placeholder="Hello" />
          </label>

          <label for="body">
            Message
            <textarea id="body" name="body" placeholder="Write your message here"></textarea>
          </label>

          <button type="submit">Send</button>
        </form>
      </section>
    </main>
  </body>
